name: Windows

'on':
  #push:
  #pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Conan
        run: python -m pip install 'conan==2.32.0'
      - name: Restore compiled Conan packages
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: build/windows/${{ matrix.arch }}/conan-cache.tgz
          key: conan2-2.32.0-windows-msvc-${{ matrix.arch }}-${{ hashFiles('conanfile.py', 'conan/luajit/conanfile.py', 'dist/build-windows.ps1', '.github/workflows/windows.yml') }}
          restore-keys: |
            conan2-2.32.0-windows-msvc-${{ matrix.arch }}-
      - name: Build
        shell: pwsh
        run: ./dist/build-windows.ps1 '${{ matrix.arch }}'
      - name: Save compiled Conan packages
        if: ${{ always() && steps.conan-cache.outputs.cache-hit != 'true' && hashFiles(format('build/windows/{0}/conan-cache.tgz', matrix.arch)) != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/windows/${{ matrix.arch }}/conan-cache.tgz
          key: conan2-2.32.0-windows-msvc-${{ matrix.arch }}-${{ hashFiles('conanfile.py', 'conan/luajit/conanfile.py', 'dist/build-windows.ps1', '.github/workflows/windows.yml') }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLF2-Windows-${{ matrix.arch }}
          path: |
            out/OpenLF2-Windows-${{ matrix.arch }}.zip
            out/OpenLF2-Windows-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
